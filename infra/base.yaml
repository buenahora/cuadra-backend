AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >
  Base compartida de la plataforma de alquileres. Red (VPC, subnets, rutas, NACL),
  VPC endpoints, security groups, topic de alertas, bucket de artefactos, presupuesto
  y acceso de GitHub Actions por OIDC. Se despliega a mano, una vez, y cambia poco.

Parameters:
  Project:
    Type: String
    Default: alquileres
    AllowedPattern: '[a-z0-9-]+'
  Environment:
    Type: String
    Default: prd
    AllowedValues: [dev, prd]
  GitHubOrg:
    Type: String
    Description: Organización o usuario de GitHub dueño de los repos
  FrontendRepo:
    Type: String
    Description: Nombre del repo del frontend (sin la org)
  BackendRepo:
    Type: String
    Description: Nombre del repo del backend (sin la org)
  PipelineRepo:
    Type: String
    Description: Nombre del repo del pipeline de datos (sin la org)
  # GitHub pasó a "immutable subject claims": en los repos creados desde 2025 el
  # claim sub del token OIDC viene como repo:<org>@<orgId>/<repo>@<repoId>:ref:...
  # en vez de repo:<org>/<repo>:ref:... Los roles de abajo aceptan las dos formas,
  # así que estos ids son obligatorios. Sacarlos con:
  #   gh api /users/<org> --jq .id      y      gh api /repos/<org>/<repo> --jq .id
  GitHubOrgId:
    Type: String
    Description: Id numérico de la organización o usuario de GitHub
  FrontendRepoId:
    Type: String
    Description: Id numérico del repo del frontend
  BackendRepoId:
    Type: String
    Description: Id numérico del repo del backend
  PipelineRepoId:
    Type: String
    Description: Id numérico del repo del pipeline de datos
  AlertEmail:
    Type: String
    Description: Mail del equipo para alertas y presupuesto
  MonthlyBudgetUsd:
    Type: Number
    Default: 200
  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: Prefix list com.amazonaws.global.cloudfront.origin-facing en us-east-1 (verificar con aws ec2 describe-managed-prefix-lists)
  S3PrefixListId:
    Type: String
    Default: pl-63a5400a
    Description: Prefix list com.amazonaws.us-east-1.s3 (verificar con aws ec2 describe-prefix-lists)
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Poner false si la cuenta ya tiene el OIDC provider de GitHub
  # Sin dominio propio no hay certificado ACM, y sin certificado el ALB no puede
  # escuchar en 443. Esto abre el 80 del ALB para poder desplegar y probar el
  # backend antes de comprar el dominio. Sigue limitado a la prefix list de
  # CloudFront, igual que el 443. Volver a 'false' al poner el certificado.
  AllowAlbHttp:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Abrir el puerto 80 del ALB (solo mientras no haya certificado)

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  PermitirAlbHttp: !Equals [!Ref AllowAlbHttp, 'true']

Resources:
  # ---------------------------------------------------------------- Red
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-vpc'}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-public-a'}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-public-b'}]
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-app-a'}]
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-app-b'}]
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.20.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-data-a'}]
  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-data-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-public'}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  # Capa app: sin ruta a internet, solo local + gateway endpoint de S3
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-app'}]
  AppSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetA, RouteTableId: !Ref AppRouteTable}
  AppSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetB, RouteTableId: !Ref AppRouteTable}

  # Capa datos: solo ruta local
  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-data'}]
  DataSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataSubnetA, RouteTableId: !Ref DataRouteTable}
  DataSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataSubnetB, RouteTableId: !Ref DataRouteTable}

  # NACL de la capa de datos: 5432 desde la capa app, respuestas efímeras de vuelta
  # y tráfico interno de la capa (réplica Multi-AZ)
  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-data-nacl'}]
  DataNaclInPostgres:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: 10.0.10.0/23
      PortRange: {From: 5432, To: 5432}
  DataNaclInIntra:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 110
      Protocol: -1
      RuleAction: allow
      CidrBlock: 10.0.20.0/23
  DataNaclOutEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Protocol: 6
      Egress: true
      RuleAction: allow
      CidrBlock: 10.0.10.0/23
      PortRange: {From: 1024, To: 65535}
  DataNaclOutIntra:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 110
      Protocol: -1
      Egress: true
      RuleAction: allow
      CidrBlock: 10.0.20.0/23
  DataSubnetANacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DataSubnetA, NetworkAclId: !Ref DataNacl}
  DataSubnetBNacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DataSubnetB, NetworkAclId: !Ref DataNacl}

  # ---------------------------------------------------------------- VPC endpoints
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: [!Ref AppRouteTable]

  'Fn::ForEach::InterfaceEndpoints':
    - Service
    - [ssm, ssmmessages, ec2messages, logs, monitoring, secretsmanager]
    - 'Endpoint${Service}':
        Type: AWS::EC2::VPCEndpoint
        Properties:
          VpcId: !Ref Vpc
          VpcEndpointType: Interface
          ServiceName: !Sub 'com.amazonaws.${AWS::Region}.${Service}'
          PrivateDnsEnabled: true
          SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
          SecurityGroupIds: [!Ref EndpointsSG]

  # ---------------------------------------------------------------- Security groups
  # Cada SG declara una regla de salida inofensiva (ICMP a 127.0.0.1) para que
  # CloudFormation no agregue la salida a 0.0.0.0/0 por defecto. Las reglas reales
  # van como recursos separados para evitar dependencias circulares.
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB, 443 solo desde CloudFront
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: HTTPS desde CloudFront
      SecurityGroupEgress:
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-sg-alb'}]
  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Instancias Express del ASG
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-sg-app'}]
  DbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-sg-db'}]
  GlueSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ENIs de las Glue connections
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-sg-glue'}]
  RotationSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda de rotacion de secretos
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-sg-rotation'}]
  EndpointsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-sg-endpoints'}]

  # Entrada HTTP al ALB, solo mientras no haya certificado (ver AllowAlbHttp).
  AlbHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: PermitirAlbHttp
    Properties:
      GroupId: !Ref AlbSG
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontPrefixListId
      Description: HTTP desde CloudFront (provisorio, sin certificado)
  # ALB -> App
  AlbToApp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AlbSG, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, DestinationSecurityGroupId: !Ref AppSG}
  AppFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AppSG, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSG}
  # App -> DB, endpoints, S3
  AppToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DbSG}
  AppToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointsSG}
  AppToS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId}
  # Glue: self-reference obligatorio + DB, endpoints, S3
  GlueSelfIn:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref GlueSG, IpProtocol: tcp, FromPort: 0, ToPort: 65535, SourceSecurityGroupId: !Ref GlueSG}
  GlueSelfOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref GlueSG, IpProtocol: tcp, FromPort: 0, ToPort: 65535, DestinationSecurityGroupId: !Ref GlueSG}
  GlueToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref GlueSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DbSG}
  GlueToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref GlueSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointsSG}
  GlueToS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref GlueSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId}
  # Rotación -> DB, endpoints
  RotationToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref RotationSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DbSG}
  RotationToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref RotationSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointsSG}
  # Entradas a la DB
  DbFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DbSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSG}
  DbFromGlue:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DbSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref GlueSG}
  DbFromRotation:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DbSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref RotationSG}
  # Entradas a los endpoints
  EndpointsFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref EndpointsSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref AppSG}
  EndpointsFromGlue:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref EndpointsSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref GlueSG}
  EndpointsFromRotation:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref EndpointsSG, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref RotationSG}

  # ---------------------------------------------------------------- Alertas y costos
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Project}-${Environment}-alerts'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EventBridgeYCloudWatch
            Effect: Allow
            Principal:
              Service: [events.amazonaws.com, cloudwatch.amazonaws.com]
            Action: sns:Publish
            Resource: !Ref AlertsTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${Project}-${Environment}-mensual'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

  # ---------------------------------------------------------------- Artefactos de CI
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-artifacts-${AWS::AccountId}'
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: limpiar-versiones-viejas
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  # Instance profile para la instancia temporal de Packer (lee el artefacto de S3)
  PackerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: leer-artefactos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactsBucket.Arn}/backend/*'
  PackerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref PackerRole]

  # ---------------------------------------------------------------- GitHub Actions (OIDC)
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # Rol que usa CloudFormation para crear los recursos. Los roles de deploy de cada
  # repo solo pueden operar sus stacks y pasar este rol.
  # TODO: reemplazar AdministratorAccess por una política acotada a los servicios usados.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-cfn-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-deploy-frontend'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidc, !Ref GitHubOidcProvider, !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com']
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Las dos formas del claim sub: la clásica y la inmutable (ver los
              # parámetros *Id arriba). Así el rol sirve antes y después de que
              # GitHub migre el repo, y sobrevive a un rename.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrg}/${FrontendRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOrg}@${GitHubOrgId}/${FrontendRepo}@${FrontendRepoId}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-${Environment}-frontend/*'
              - Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub 'arn:aws:s3:::${Project}-${Environment}-site-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${Project}-${Environment}-site-${AWS::AccountId}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: '*'

  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-deploy-backend'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidc, !Ref GitHubOidcProvider, !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com']
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Las dos formas del claim sub: la clásica y la inmutable (ver los
              # parámetros *Id arriba). Así el rol sirve antes y después de que
              # GitHub migre el repo, y sobrevive a un rename.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrg}/${BackendRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOrg}@${GitHubOrgId}/${BackendRepo}@${BackendRepoId}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-${Environment}-backend/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/*'
              - Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate, cloudformation:CreateChangeSet]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt CfnExecutionRole.Arn, !GetAtt PackerRole.Arn]
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${ArtifactsBucket.Arn}/backend/*'
              - Sid: InstanceRefresh
                Effect: Allow
                Action: [autoscaling:StartInstanceRefresh, autoscaling:DescribeInstanceRefreshes, autoscaling:DescribeAutoScalingGroups]
                Resource: '*'
              - Sid: SnapshotAntesDeMigrar
                Effect: Allow
                Action: [rds:CreateDBSnapshot, rds:DescribeDBSnapshots, rds:DescribeDBInstances, rds:AddTagsToResource]
                Resource: '*'
              - Sid: Packer
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                  - ec2:CreateImage
                  - ec2:RegisterImage
                  - ec2:DeregisterImage
                  - ec2:CreateSnapshot
                  - ec2:DeleteSnapshot
                  - ec2:CreateTags
                  - ec2:CreateKeyPair
                  - ec2:DeleteKeyPair
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:ModifyImageAttribute
                  - ec2:GetPasswordData
                Resource: '*'

  PipelineDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-deploy-pipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidc, !Ref GitHubOidcProvider, !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com']
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Las dos formas del claim sub: la clásica y la inmutable (ver los
              # parámetros *Id arriba). Así el rol sirve antes y después de que
              # GitHub migre el repo, y sobrevive a un rename.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrg}/${PipelineRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOrg}@${GitHubOrgId}/${PipelineRepo}@${PipelineRepoId}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-${Environment}-pipeline/*'
              - Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${ArtifactsBucket.Arn}/pipeline/*'
              - Sid: CorridaDeValidacion
                Effect: Allow
                Action: [states:StartExecution, states:DescribeExecution]
                Resource: '*'

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: {Name: !Sub '${Project}-${Environment}-VpcId'}
  PublicSubnetA:
    Value: !Ref PublicSubnetA
    Export: {Name: !Sub '${Project}-${Environment}-PublicSubnetA'}
  PublicSubnetB:
    Value: !Ref PublicSubnetB
    Export: {Name: !Sub '${Project}-${Environment}-PublicSubnetB'}
  AppSubnetA:
    Value: !Ref AppSubnetA
    Export: {Name: !Sub '${Project}-${Environment}-AppSubnetA'}
  AppSubnetB:
    Value: !Ref AppSubnetB
    Export: {Name: !Sub '${Project}-${Environment}-AppSubnetB'}
  AppSubnetAAz:
    Value: !GetAtt AppSubnetA.AvailabilityZone
    Export: {Name: !Sub '${Project}-${Environment}-AppSubnetAAz'}
  AppSubnetBAz:
    Value: !GetAtt AppSubnetB.AvailabilityZone
    Export: {Name: !Sub '${Project}-${Environment}-AppSubnetBAz'}
  DataSubnetA:
    Value: !Ref DataSubnetA
    Export: {Name: !Sub '${Project}-${Environment}-DataSubnetA'}
  DataSubnetB:
    Value: !Ref DataSubnetB
    Export: {Name: !Sub '${Project}-${Environment}-DataSubnetB'}
  AlbSG:
    Value: !Ref AlbSG
    Export: {Name: !Sub '${Project}-${Environment}-AlbSG'}
  AppSG:
    Value: !Ref AppSG
    Export: {Name: !Sub '${Project}-${Environment}-AppSG'}
  DbSG:
    Value: !Ref DbSG
    Export: {Name: !Sub '${Project}-${Environment}-DbSG'}
  GlueSG:
    Value: !Ref GlueSG
    Export: {Name: !Sub '${Project}-${Environment}-GlueSG'}
  RotationSG:
    Value: !Ref RotationSG
    Export: {Name: !Sub '${Project}-${Environment}-RotationSG'}
  AlertsTopicArn:
    Value: !Ref AlertsTopic
    Export: {Name: !Sub '${Project}-${Environment}-AlertsTopicArn'}
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export: {Name: !Sub '${Project}-${Environment}-ArtifactsBucket'}
  PackerInstanceProfileName:
    Value: !Ref PackerInstanceProfile
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn
  FrontendDeployRoleArn:
    Value: !GetAtt FrontendDeployRole.Arn
  BackendDeployRoleArn:
    Value: !GetAtt BackendDeployRole.Arn
  PipelineDeployRoleArn:
    Value: !GetAtt PipelineDeployRole.Arn
