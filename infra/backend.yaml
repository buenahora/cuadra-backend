AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::SecretsManager-2020-07-23
Description: >
  Backend de la plataforma de alquileres. Cognito, RDS PostgreSQL Multi-AZ con secretos
  y rotación, ALB, Launch Template, Auto Scaling Group y alarmas. Lo despliega el CI del
  repo del backend en cada versión, pasando la AMI nueva en AmiId.

Parameters:
  Project:
    Type: String
    Default: alquileres
  Environment:
    Type: String
    Default: prd
    AllowedValues: [dev, prd]
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI generada por Packer para esta versión
  InstanceType:
    Type: String
    Default: t3.micro
  # Vacío = todavía no hay dominio propio: el ALB escucha en 80 sin TLS en vez
  # de 443. Sirve para probar el pipeline de deploy completo antes de comprar el
  # dominio. Al cargar el certificado, el listener pasa a 443 solo.
  OriginCertificateArn:
    Type: String
    Default: ''
    Description: ARN del certificado ACM de origin.<dominio> (validado por DNS). Vacío = listener HTTP sin TLS
  # La cuenta de AWS puede estar en el plan FREE, que no permite Multi-AZ ni
  # retención de backups larga ("The specified backup retention period exceeds
  # the maximum available to free tier customers"). Los defaults de acá son los
  # de producción de verdad; para una cuenta con plan FREE hay que pasar
  # MultiAZ=false y 1 día de retención. Ver "Cuenta con plan FREE" en el README.
  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: RDS en dos zonas de disponibilidad. false en cuentas con plan FREE
  DbBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35
    Description: Días de retención de backups automáticos. El plan FREE solo admite valores chicos
  DbDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Protección contra borrado de la RDS y del user pool de Cognito. false permite bajar el stack sin pasos manuales
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbName:
    Type: String
    Default: alquileres
  CodeVersion:
    Type: String
    Description: SHA del commit que se despliega. Prefijo de los artefactos en el bucket (backend/<sha>/...)
  RequestsPerTarget:
    Type: Number
    Default: 100
    Description: Requests por instancia objetivo del escalado (ajustar con prueba de carga)

Conditions:
  ProtegerDeBorrado: !Equals [!Ref DbDeletionProtection, 'true']
  ConCertificado: !Not [!Equals [!Ref OriginCertificateArn, '']]
  SinCertificado: !Equals [!Ref OriginCertificateArn, '']

Resources:
  # ---------------------------------------------------------------- Header secreto CloudFront -> ALB
  # El stack del frontend lee este secreto por nombre para agregar el header en CloudFront.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/${Environment}/origin-verify'
      Description: Valor del header X-Origin-Verify que CloudFront agrega y el ALB valida
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 48
        ExcludePunctuation: true

  # ---------------------------------------------------------------- Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Project}-${Environment}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      # Mismo interruptor que la RDS. Con la protección activa, un create que
      # falla deja el rollback trabado: CloudFormation no puede borrar el pool
      # y el stack queda en ROLLBACK_FAILED, que hay que destrabar a mano
      # desactivando la protección. Pasó el 2026-10-31.
      DeletionProtection: !If [ProtegerDeBorrado, ACTIVE, INACTIVE]
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${Project}-${Environment}-web'
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: hours, IdToken: hours, RefreshToken: days}

  # ---------------------------------------------------------------- RDS
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets de la capa de datos
      SubnetIds:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-DataSubnetA'
        - Fn::ImportValue: !Sub '${Project}-${Environment}-DataSubnetB'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${Project}-${Environment}-db'
      Engine: postgres
      # Fijar EngineVersion (por ejemplo la última 16.x disponible) para evitar sorpresas
      DBInstanceClass: !Ref DbInstanceClass
      DBName: !Ref DbName
      MultiAZ: !Ref DbMultiAZ
      StorageType: gp3
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageEncrypted: true
      MasterUsername: postgres_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-DbSG'
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      DeletionProtection: !Ref DbDeletionProtection
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true

  # Usuario de la aplicación, con permisos mínimos. La primera migración crea app_user
  # en Postgres con la contraseña de este secreto (ver README).
  AppDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/${Environment}/db-app'
      Description: Credenciales del usuario de la app en Postgres
      GenerateSecretString:
        SecretStringTemplate: '{"username": "app_user"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'' '
  # Clave con que la API firma los JWT de sesión. Generada acá y leída por la
  # app desde Secrets Manager (CUADRA_JWT_SECRET_ARN): si no, la app arranca con
  # el default de desarrollo que está en el repositorio y cualquiera que lo lea
  # puede firmarse un token válido para cualquier usuario. app/core/security.py
  # se niega a arrancar en ese caso.
  #
  # Rotarla invalida todas las sesiones abiertas, así que no se rota sola.
  AppJwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/${Environment}/jwt-signing-key'
      Description: Clave de firma de los JWT de la API
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  AppDbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref AppDbSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance
  # ---------------------------------------------------------------- Bootstrap del usuario de la DB
  # La RDS se crea con el administrador postgres_admin, y aparte existe el
  # secreto de app_user -- pero nadie creaba app_user en la base. Era un paso
  # manual del runbook, y hasta hacerlo la API y el job de Glue fallan con
  # "password authentication failed". Esto lo hace solo. Ver
  # lambdas/db_bootstrap/app.py.
  DbBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      # Para crear/borrar la ENI con la que entra a la VPC, y para los logs.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: leer-secretos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # El único componente que lee el secreto del administrador. Las
              # instancias de la app solo leen el de app_user y el del JWT.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref AppDbSecret

  DbBootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Project}-${Environment}-db-bootstrap'
      Description: Crea el usuario de la aplicación en Postgres (custom resource)
      Runtime: python3.12
      Handler: app.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt DbBootstrapRole.Arn
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub '${Project}-${Environment}-ArtifactsBucket'
        S3Key: !Sub 'backend/${CodeVersion}/db-bootstrap.zip'
      # Dentro de la VPC porque la RDS está en subredes privadas. Reutiliza el
      # security group de la app: sus reglas de salida a la DB (5432) y a los
      # VPC endpoints (443, para Secrets Manager) son exactamente las que hacen
      # falta acá, así que no se agrega un SG más.
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetA'
          - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetB'
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSG'
      Environment:
        Variables:
          DB_NAME: !Ref DbName
          # El secreto que AWS genera para el master trae solo usuario y
          # contraseña, sin host ni puerto, así que el endpoint va aparte.
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          MASTER_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          APP_SECRET_ARN: !Ref AppDbSecret

  DbBootstrap:
    Type: AWS::CloudFormation::CustomResource
    # Después del attachment: ahí es cuando el secreto de app_user ya tiene
    # host/puerto de la instancia adentro.
    DependsOn: AppDbSecretAttachment
    Properties:
      ServiceToken: !GetAtt DbBootstrapFunction.Arn
      # Cambia en cada deploy, así el recurso se vuelve a ejecutar y mantiene
      # la contraseña del rol sincronizada con el secreto.
      Version: !Ref CodeVersion

  AppDbSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: AppDbSecretAttachment
    Properties:
      SecretId: !Ref AppDbSecret
      RotationRules: {AutomaticallyAfterDays: 30}
      HostedRotationLambda:
        RotationType: PostgreSQLMultiUser
        RotationLambdaName: !Sub '${Project}-${Environment}-db-rotation'
        MasterSecretArn: !GetAtt Database.MasterUserSecret.SecretArn
        VpcSubnetIds: !Join
          - ','
          - - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetA'
            - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetB'
        VpcSecurityGroupIds:
          Fn::ImportValue: !Sub '${Project}-${Environment}-RotationSG'

  # ---------------------------------------------------------------- Instancias
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: leer-secretos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppDbSecret
                  - !Ref AppJwtSecret
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${Project}-${Environment}-api'
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSG'
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Name, Value: !Sub '${Project}-${Environment}-api'}]
        # La AMI ya trae el código y el servicio systemd. El user data solo deja la
        # configuración que depende del stack.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            mkdir -p /etc/alquileres
            cat > /etc/alquileres/app.env <<EOF
            APP_ENV=production
            # PORT y ROOT_PATH las consume la unidad de systemd como flags de
            # uvicorn (ver packer/files/alquileres-api.service), no la app: van
            # sin prefijo a propósito.
            PORT=3000
            ROOT_PATH=/api
            # Las dos: botocore resuelve la región de AWS_DEFAULT_REGION y NO
            # de AWS_REGION. Con solo la segunda puesta, la app moría al
            # arrancar con NoRegionError teniendo la variable a la vista.
            # CUADRA_AWS_REGION es la que lee Settings y la que la app pasa
            # explícita a boto3 (app/core/secrets.py), así que es la que
            # realmente importa; las otras dos quedan para el awscli de la
            # máquina y para cualquier otro cliente.
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}
            CUADRA_AWS_REGION=${AWS::Region}
            # Las que lee la app necesitan el prefijo CUADRA_: es el env_prefix
            # de Settings en app/core/config.py. Sin el prefijo se ignoran, que
            # es lo que pasaba antes con DB_SECRET_ARN -- la API quedaba con el
            # SQLite local de cada instancia y la RDS sin usar.
            CUADRA_DB_SECRET_ARN=${AppDbSecret}
            CUADRA_JWT_SECRET_ARN=${AppJwtSecret}
            EOF
            systemctl restart alquileres-api

  # ---------------------------------------------------------------- ALB
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Project}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-PublicSubnetA'
        - Fn::ImportValue: !Sub '${Project}-${Environment}-PublicSubnetB'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AlbSG'
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Project}-${Environment}-api'
      VpcId:
        Fn::ImportValue: !Sub '${Project}-${Environment}-VpcId'
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  # Uno de los dos, nunca los dos: con certificado va 443 con TLS, sin
  # certificado va 80 en claro (ver el parámetro OriginCertificateArn). En los
  # dos casos el default es 403: solo pasa el tráfico que trae el header
  # secreto que agrega CloudFront, por la regla FromCloudFrontRule.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: ConCertificado
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref OriginCertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: SinCertificado
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}
  FromCloudFrontRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [ConCertificado, !Ref HttpsListener, !Ref HttpListener]
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- Auto Scaling
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # La app corre init_db() al importar: si app_user todavía no existe, uvicorn
    # no levanta, el health check falla y el instance refresh se cae. Así que
    # las instancias arrancan después del bootstrap, no antes.
    DependsOn: DbBootstrap
    Properties:
      AutoScalingGroupName: !Sub '${Project}-${Environment}-api'
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetA'
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetB'
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
  RequestScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    DependsOn: FromCloudFrontRule
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: !Ref RequestsPerTarget
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${LoadBalancer.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}'

  # ---------------------------------------------------------------- Alarmas
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: La API devuelve errores 5xx
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AlertsTopicArn'
  NoHealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: El target group no tiene instancias sanas
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AlertsTopicArn'
  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU alta en RDS
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref Database}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AlertsTopicArn'

Outputs:
  AlbDnsName:
    Description: Apuntar origin.<dominio> con un CNAME a este valor
    Value: !GetAtt LoadBalancer.DNSName
    Export: {Name: !Sub '${Project}-${Environment}-AlbDnsName'}
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  DbInstanceId:
    Value: !Ref Database
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: {Name: !Sub '${Project}-${Environment}-DbEndpoint'}
  AppJwtSecretArn:
    Description: Secreto con la clave de firma de los JWT (la app lo lee como CUADRA_JWT_SECRET_ARN)
    Value: !Ref AppJwtSecret
    Export: {Name: !Sub '${Project}-${Environment}-AppJwtSecretArn'}
  AppDbSecretArn:
    Value: !Ref AppDbSecret
    Export: {Name: !Sub '${Project}-${Environment}-AppDbSecretArn'}
  OriginVerifySecretName:
    Value: !Sub '${Project}/${Environment}/origin-verify'
    Export: {Name: !Sub '${Project}-${Environment}-OriginVerifySecretName'}
  UserPoolId:
    Value: !Ref UserPool
    Export: {Name: !Sub '${Project}-${Environment}-UserPoolId'}
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export: {Name: !Sub '${Project}-${Environment}-UserPoolClientId'}
