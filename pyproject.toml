[project]
name = "cuadra-backend"
version = "0.1.0"
description = "API operacional de Cuadra: usuarios, avisos, consultas e inteligencia de mercado. Contract-first -- ver README.md."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.1,<5",
    "python-multipart>=0.0.9,<1",
    "fpdf2>=2.7,<3",
    "duckdb>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
