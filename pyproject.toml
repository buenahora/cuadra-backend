[project]
name = "cuadra-backend"
version = "0.1.0"
description = "API operacional de Cuadra: usuarios, avisos, consultas e inteligencia de mercado. Contract-first -- ver README.md."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.1,<5",
    "python-multipart>=0.0.9,<1",
    "fpdf2>=2.7,<3",
    "duckdb>=1.1,<2",
    # Postgres (RDS) para los datos operacionales en AWS. pg8000 es el mismo
    # driver que usa el job de Glue de cuadra-data (glue/requirements-glue.txt):
    # Python puro, sin nada que compilar, así que entra en la AMI sin toolchain.
    "pg8000>=1.31,<2",
    # Solo para leer el secreto de la RDS de Secrets Manager al abrir conexión.
    "boto3>=1.34,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
